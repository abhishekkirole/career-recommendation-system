<!DOCTYPE html>
<html>
<body>
    <h1>Simple Test</h1>
    <button onclick="test()">Test Connection</button>
    <div id="result"></div>

    <script>
        async function test() {
            try {
                const response = await fetch('http://localhost:8000/api/health/');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    'SUCCESS: ' + JSON.stringify(data);
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    'ERROR: ' + error.message;
            }
        }
        // Auto-test
        test();
    </script>
</body>
</html>
